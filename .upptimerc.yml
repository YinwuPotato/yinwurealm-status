# YinwuRealm 监测配置。维护：Soidraw。
# 当前只监测和记录故障；GitHub 令牌在仓库 Actions Secrets 中填写。
owner: YinwuPotato
repo: yinwurealm-status
user-agent: Soidraw

sites:
  - name: YinwuRealm 官网
    slug: website
    url: https://www.yinwurealm.org/
    method: GET
    expectedStatusCodes:
      - 200
    maxResponseTime: 10000
    # 同时检查正文，避免把返回 200 的空白页计为正常。
    __dangerous__body_down_if_text_missing: YinwuRealm
    icon: https://yinwupotato.github.io/yinwurealm-status/yinwurealm-icon.png

assignees:
  - Soidraw

# 暂不启用邮件或 Discord 通知。
# GH_PAT 由官方工作流单独传入，不受这个空白名单影响。
secrets: []

# 保留短暂故障的 Issue，恢复后关闭，不删除。
skipDeleteIssues: true

# 主调度由 cloudflare/worker.mjs 完成：每五分钟检测一次。
# GitHub 原生定时保留作备用；uptime 降为每日一次，避免恢复后双倍检测。
# 以下维护任务的时刻与 Worker 一致；API 调度不要求原生 schedule 生效。
workflowSchedule:
  uptime: "1 4 * * *"
  responseTime: "17 */6 * * *"
  summary: "25 0 * * *"
  graphs: "35 0 * * *"
  staticSite: "45 0 * * *"
  updateTemplate: "15 3 * * 1"
  updates: "30 3 * * *"

# 不让自动任务修改仓库元数据，令牌无需为此增加管理权限。
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

status-website:
  baseUrl: /yinwurealm-status
  name: YinwuRealm 服务状态
  # assets 在页面导出后才复制；使用本站完整网址，避免导出器把图片误建成页面目录。
  logoUrl: https://yinwupotato.github.io/yinwurealm-status/yinwurealm-icon.png
  favicon: https://yinwupotato.github.io/yinwurealm-status/yinwurealm-icon.png
  introTitle: "YinwuRealm 服务状态"
  introMessage: "查看官网可用性、响应时间和故障记录。状态来自定期检测，短暂故障可能发生在两次检测之间。"
  navbar:
    - title: 服务状态
      href: /yinwurealm-status/
    - title: 官网
      href: https://www.yinwurealm.org/
    - title: 故障记录
      href: https://github.com/YinwuPotato/yinwurealm-status/issues

